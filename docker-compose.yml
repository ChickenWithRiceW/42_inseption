services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inseption_net
    restart: always
    env_file:
      - ./srcs/.env
    secrets:
      - db_password
      - db_root_password


volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      device: /home/ascheufe/data/mysql
      o: bind

networks:
  inseption_net:
    driver: bridge

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt
