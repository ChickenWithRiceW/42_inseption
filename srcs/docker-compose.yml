services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inseption_net
    restart: always
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inseption_net
    restart: always
    env_file:
      - .env
    secrets:
      - db_password
      - wp_user_password
      - wp_admin_password
    depends_on:
      - mariadb

  nginx:
    container_name: nginx
    build: ./requirements/nginx
    image: nginx
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inseption_net
    restart: always
    env_file:
      - .env
    depends_on:
      - wordpress
    ports:
      - "443:443"

  # Bonus
  redis:
    container_name: redis
    build: ./requirements/bonus/redis
    networks:
      - inseption_net
    restart: always
  
  ftp:
    container_name: ftp
    build: ./requirements/bonus/ftp
    networks:
      - inseption_net
    restart: always
    volumes:
      - wordpress_data:/var/www/html:ro
    secrets:
      - ftp_user_password
    ports:
      - "21:21"
      - "40000-40010:40000-40010"

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      device: /home/ascheufe/data/mysql
      o: bind

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ascheufe/data/wordpress

networks:
  inseption_net:
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  ftp_user_password:
    file: ../secrets/ftp_user_password.txt
